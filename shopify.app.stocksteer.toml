# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "31a46a1af7c7a3534921427cef8c540b"
name = "StockSteer"
application_url = "https://stocksteer-app.maxvideohub.com"
embedded = false

[build]
# 2026-08-21 改 false(P0-T5 已上线,还欠账⑧):true 时本地一跑 shopify app dev
# 就会把线上 application_url / redirect_urls 冲掉,线上安装当场断。
# P3 联调需要 tunnel 回写时临时翻开,用完当场翻回。
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-07"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_all_orders,read_inventory,read_locations,read_orders,read_products"
optional_scopes = [ ]
# 拍板 0(2026-08-20)= 独立形态。非嵌入应用必须走 authorization code grant,
# 即 legacy install flow;托管安装(false)要求 token exchange,而 token exchange
# 需要 App Bridge 的 session token,非嵌入下拿不到。两者不可混写。
use_legacy_install_flow = true

[auth]
redirect_urls = [ "https://stocksteer-app.maxvideohub.com/auth/shopify/callback" ]
